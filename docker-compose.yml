# Infrastructure for local development: PostgreSQL 16 with the pgvector extension.
# The StackTrial backend runs on the host (mvn spring-boot:run) so it can reach the Docker Engine directly.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stacktrial-postgres
    environment:
      POSTGRES_DB: stacktrial
      POSTGRES_USER: stacktrial
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-stacktrial}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stacktrial-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacktrial -d stacktrial"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  stacktrial-pgdata:
