<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title th:text="${title} + ' · StackShield'">StackShield · Codebase Analyzer</title>
 <link rel="stylesheet" th:href="@{/css/app.css(v='20261027_polish_v1')}">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
 <style>
 :root {
 --bg-page: #F4F0FF !important;
 --bg-card: #FFFFFF !important;
 --primary: #6C4BEF !important;
 --primary-dark: #49318F !important;
 --primary-hover: #5A3AD9 !important;
 --primary-light: #E6DEFF !important;
 --primary-soft: #B9A0FF !important;
 --border: #E5DDF5 !important;
 --border-light: #F0EAFB !important;
 --text-main: #242033 !important;
 --text-secondary: #77718B !important;
 }
 body, html {
 background-color: #F4F0FF !important;
 color: #242033 !important;
 font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
 }
 .sidebar {
 background: #FFFFFF !important;
 border-right: 1px solid #E5DDF5 !important;
 }
 .sidebar-nav a.active {
 background: #E6DEFF !important;
 color: #49318F !important;
 font-weight: 600 !important;
 }
 .topbar {
 background: #FFFFFF !important;
 border-bottom: 1px solid #E5DDF5 !important;
 }
 </style>
</head>
<body>

<!-- Clean Lavender/White Sidebar -->
<aside th:fragment="sidebar(activeNav)" class="sidebar">
 <div class="sidebar-header">
 <a class="brand-logo" th:href="@{/}">
 <span class="brand-icon-box">
 <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
 </svg>
 </span>
 <span>Stack<strong style="color: var(--primary);">Shield</strong></span>
 </a>
 <div class="brand-tagline">Codebase Analyzer for Java</div>
 </div>

 <!-- Clean 4-Item Navigation with Inline SVGs -->
 <div class="sidebar-nav-container">
 <ul class="sidebar-nav">
 <li>
 <a th:href="@{/}" th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">
 <span class="nav-icon">
 <svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
 </svg>
 </span>
 <span>Dashboard</span>
 </a>
 </li>
 <li>
 <a th:href="@{/#analyzer}" th:classappend="${activeNav == 'analyze' ? 'active' : ''}">
 <span class="nav-icon">
 <svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
 </svg>
 </span>
 <span>Analyze Repository</span>
 </a>
 </li>
 <li>
 <a th:href="@{/history}" th:classappend="${activeNav == 'history' ? 'active' : ''}">
 <span class="nav-icon">
 <svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
 </svg>
 </span>
 <span>Analysis History</span>
 </a>
 </li>
 <li>
 <a th:href="@{/upgrade-check}" th:classappend="${activeNav == 'upgrades' ? 'active' : ''}">
 <span class="nav-icon">
 <svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
 </svg>
 </span>
 <span>Upgrade Check</span>
 </a>
 </li>
 </ul>
 </div>

 <div class="sidebar-footer">
 <span style="font-size: 11.5px; color: var(--text-secondary);">Rule Engine Ready</span>
 <span class="badge badge-pass" style="font-size: 10px; padding: 2px 7px;">ACTIVE</span>
 </div>
</aside>

<!-- Clean White Topbar -->
<header th:fragment="topbar" class="topbar">
 <div class="topbar-left">
 <div class="breadcrumbs">
 <a th:href="@{/}" style="display: inline-flex; align-items: center; gap: 6px;">
 <svg class="svg-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
 </svg>
 <span>StackShield</span>
 </a>
 <span>/</span>
 <span class="breadcrumbs-current" th:text="${#strings.toUpperCase(activeNav ?: 'Dashboard')}">DASHBOARD</span>
 </div>
 </div>
 <div class="topbar-right">
 <a th:href="@{/}" class="btn btn-primary btn-sm">
 Analyze Repository
 </a>
 </div>
</header>

<!-- Shared Toast Notification Container & Script -->
<div th:fragment="toastContainer" id="toastContainer" class="toast-container"></div>

<script th:fragment="toastScript">
 function showToast(message, type) {
 var container = document.getElementById('toastContainer');
 if (!container) {
 container = document.createElement('div');
 container.id = 'toastContainer';
 container.className = 'toast-container';
 document.body.appendChild(container);
 }
 var toast = document.createElement('div');
 toast.className = 'toast ' + (type === 'error' ? 'toast-error' : 'toast-success');
 
 var iconSvg = type === 'error'
 ? '<svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="#EF4444" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
 : '<svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="#6C4BEF" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>';
 
 toast.innerHTML = iconSvg + '<span>' + message + '</span>';
 container.appendChild(toast);
 
 setTimeout(function() {
 toast.style.opacity = '0';
 toast.style.transform = 'translateY(8px)';
 setTimeout(function() { toast.remove(); }, 200);
 }, 3200);
 }
</script>

</body>
</html>
