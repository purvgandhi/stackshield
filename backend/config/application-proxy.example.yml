# Example for machines where outbound HTTPS must go through a proxy with its own CA (corporate networks,
# sandboxes). Copy to application-proxy.local.yml, adjust, and start with:
#   java -jar target/stacktrial-*.jar --spring.config.additional-location=file:config/application-proxy.local.yml
# The same settings are applied to baseline and trial containers.
stacktrial:
  runner:
    network-mode: host          # only if the proxy listens on the host's loopback interface
    extra-env:
      MAVEN_OPTS: "-Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=3128 -Djavax.net.ssl.trustStore=/stacktrial/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    extra-binds:
      - /path/to/truststore/cacerts:/stacktrial/cacerts   # mounted read-only
